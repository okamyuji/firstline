{{define "content"}}{{if .Events}}<ul class="events">
{{range .Events}}<li class="stub{{if not .Open}} is-upcoming{{else if .SoldOut}} is-soldout{{end}}"><a class="stub-title" href="/events/{{.ID}}">{{.Title}}</a>
<span class="stub-date">{{.Date}}</span> <span class="stub-price">{{.Price}}</span>
{{if not .Open}}<span class="badge">{{$.T "list.not_on_sale"}}</span>{{else if .SoldOut}}<span class="badge">{{$.T "list.sold_out"}}</span>{{else}}<span class="badge is-open">{{$.T "label.remaining"}} {{.Remaining}}</span>{{end}}</li>
{{end}}</ul>{{else}}<p>{{.T "list.empty"}}</p>{{end}}{{end}}
