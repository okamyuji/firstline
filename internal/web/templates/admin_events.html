{{define "content"}}<p><a href="/admin/events/new">{{.T "admin.events.new"}}</a></p>
{{if .Events}}<ul class="events">
{{range .Events}}<li><a href="/admin/events/{{.ID}}">{{.Title}}</a>
<span>{{.Date}}</span>
<span>{{$.T "admin.create.sale_start"}} {{.SaleStart}}</span>
<span>{{$.T "label.remaining"}} {{.Remaining}}</span></li>
{{end}}</ul>{{else}}<p>{{.T "list.empty"}}</p>{{end}}
<form method="post" action="/admin/logout"><button type="submit">{{.T "admin.logout"}}</button></form>{{end}}
