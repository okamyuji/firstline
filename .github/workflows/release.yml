name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and pack
        id: pack
        run: |
          line=$(bash scripts/package.sh "$GITHUB_REF_NAME")
          echo "$line"
          echo "sha256=${line%% *}" >>"$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/firstline-$GITHUB_REF_NAME-linux-arm64.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --notes "firstline-$GITHUB_REF_NAME-linux-arm64.tar.gz SHA-256: $SHA256"
