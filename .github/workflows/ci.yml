name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
      - name: Quality gates
        env:
          # A push to main has no PR base, so mutate the lines the push added.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          # The socket tests skip where binding a unix socket is not permitted; CI must run them.
          FIRSTLINE_REQUIRE_SOCKET_TESTS: "1"
        run: bash scripts/check.sh
